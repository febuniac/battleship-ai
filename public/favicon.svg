<?xml version="1.0" encoding="UTF-8"?>
<!--
  A warship in profile on the app's own pale sea. Drawn for 16px first: one bold ink silhouette,
  no hairlines and no gradients, so the shape survives being shrunk into a tab. The colours are
  the sea-200, ink and sea-500 theme values from src/index.css, written as sRGB because a favicon
  is rendered outside the page and can neither read the theme nor count on oklch support.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Battleship AI">
  <rect width="32" height="32" rx="7" fill="#ceecf9" />
  <g fill="#192d41">
    <!-- Hull at the waterline: deck across the full beam, flared sides, rounded forefoot. -->
    <path d="M3.6 17.9h24.8l-2.7 4.6q-.7 1.2-2.1 1.2H7.9q-1.4 0-2-1.2z" />
    <!-- Deckhouse, bridge and mast, stacked amidships. -->
    <path d="M10.7 13.6h6.6v4.3h-6.6z" />
    <path d="M12.7 10.1h2.9v3.5h-2.9z" />
    <path d="M13.7 6.2h.9v3.9h-.9z" />
    <!-- Funnel, just aft of the bridge. -->
    <path d="M17.9 12.4h1.9v5.5h-1.9z" />
    <!-- Two turrets, forward and aft, both trained to starboard. -->
    <path d="M20.7 15.4h3v2.5h-3z" />
    <path d="M23.7 16.3h2.9v.9h-2.9z" />
    <path d="M7.2 15.8h2.6v2.1H7.2z" />
  </g>
  <!-- Water the hull sits in: two ripples, so the ship reads as afloat rather than as a diagram. -->
  <g fill="none" stroke="#79b4d2" stroke-width="1.6" stroke-linecap="round">
    <path d="M6.2 26.6h7.2" />
    <path d="M16.6 26.6h9.2" />
  </g>
</svg>
